# Long-running SASL/PLAIN consumer on users (shows up as a consumer group with lag
# in USM). Credentials come from the kafka-client-consumer secret created by
# scripts/deploy-cp.sh - nothing inline.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: persistent-consumer
  namespace: usm
  labels: { app: persistent-consumer }
spec:
  replicas: 1
  selector:
    matchLabels: { app: persistent-consumer }
  template:
    metadata:
      labels: { app: persistent-consumer }
    spec:
      containers:
        - name: consumer
          image: confluentinc/cp-kafka:8.3.0
          envFrom:
            - secretRef:
                name: kafka-client-consumer # SASL_USERNAME / SASL_PASSWORD
          command: ["bash", "-c"]
          args:
            - |
              cat > /tmp/consumer.properties <<EOF
              security.protocol=SASL_PLAINTEXT
              sasl.mechanism=PLAIN
              sasl.jaas.config=org.apache.kafka.common.security.plain.PlainLoginModule required username="${SASL_USERNAME}" password="${SASL_PASSWORD}";
              EOF
              exec kafka-console-consumer --bootstrap-server kafka.usm.svc.cluster.local:9093 \
                --topic users --group users-persistent-consumer --from-beginning \
                --consumer.config /tmp/consumer.properties > /dev/null
          resources:
            requests: { cpu: 50m, memory: 256Mi }
            limits: { cpu: 500m, memory: 512Mi }
