# Reads the mirrored Avro topic test2 from Confluent Cloud and deserializes it
# with the Confluent Cloud Schema Registry - only works because Schema Linking
# copied the schema with its original ID. `kubectl -n usm logs deploy/ccloud-avro-consumer`
# shows decoded pageviews.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ccloud-avro-consumer
  namespace: usm
  labels: { app: ccloud-avro-consumer }
spec:
  replicas: 1
  selector:
    matchLabels: { app: ccloud-avro-consumer }
  template:
    metadata:
      labels: { app: ccloud-avro-consumer }
    spec:
      containers:
        - name: consumer
          image: confluentinc/cp-schema-registry:8.3.0
          envFrom:
            - secretRef:
                name: ccloud-client # BOOTSTRAP / API_KEY / API_SECRET / SR_URL / SR_API_KEY / SR_API_SECRET
          env:
            - { name: SCHEMA_REGISTRY_HEAP_OPTS, value: "-Xmx256m" }
          command: ["bash", "-c"]
          args:
            - |
              cat > /tmp/client.properties <<EOF
              security.protocol=SASL_SSL
              sasl.mechanism=PLAIN
              sasl.jaas.config=org.apache.kafka.common.security.plain.PlainLoginModule required username="${API_KEY}" password="${API_SECRET}";
              EOF
              # Print one decoded record every ~10s instead of flooding the log.
              exec kafka-avro-console-consumer --bootstrap-server "$BOOTSTRAP" \
                --topic test2 --group ccloud-avro-consumer \
                --consumer.config /tmp/client.properties \
                --property schema.registry.url="$SR_URL" \
                --property basic.auth.credentials.source=USER_INFO \
                --property basic.auth.user.info="${SR_API_KEY}:${SR_API_SECRET}" \
                | { n=0; while IFS= read -r line; do (( n++ % 50 == 0 )) && echo "$line"; done; }
          resources:
            requests: { cpu: 50m, memory: 384Mi }
            limits: { cpu: 500m, memory: 768Mi }
