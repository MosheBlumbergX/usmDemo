# Self-managed Connect on EKS whose Kafka is the Confluent Cloud Enterprise
# cluster (over PrivateLink), not the CP cluster. It reports to the same USM
# Agent and is registered with USM against the lkc- cluster, so its connectors
# show up under Connectors -> Self-managed next to the CP-backed ones.
# ${...} values are filled in by scripts/deploy-connect-cloud.sh.
apiVersion: platform.confluent.io/v1beta1
kind: Connect
metadata:
  name: connect-cloud
  namespace: usm
spec:
  replicas: 1
  image:
    application: confluentinc/cp-server-connect:8.3.0
    init: confluentinc/confluent-init-container:3.3.1
  build:
    type: onDemand
    onDemand:
      plugins:
        locationType: confluentHub
        confluentHub:
          - name: kafka-connect-datagen
            owner: confluentinc
            version: 0.7.3
  configOverrides:
    server:
      # Same CP 8.3.0 metrics workaround as k8s/cfk/30-connect.yaml.
      - confluent.telemetry.exporter._usm.metrics.include=io.confluent.kafka.connect/.*(connect/request_size_avg|connect_worker/connector_failed_task_count|connect_worker/connector_total_task_count|sink_task/sink_record_send_total|source_task/source_record_write_total|deadletterqueue_produce_requests).*|io.confluent.kafka.client/.*(consumer_fetch_manager/bytes_consumed_total|producer/outgoing_byte_total).*|io.confluent.hybrid/node_count
  dependencies:
    kafka:
      bootstrapEndpoint: ${CCLOUD_BOOTSTRAP}
      authentication:
        type: plain
        jaasConfig:
          secretRef: ccloud-connect-credential
      tls:
        enabled: true
        # Confluent Cloud uses a public CA (Let's Encrypt), already in the JVM truststore.
        ignoreTrustStoreConfig: true
    usmAgentClient:
      url: http://usm-agent.usm.svc.cluster.local:10000
---
# Cloud topic for the connector below, managed by CFK like `orders`.
apiVersion: platform.confluent.io/v1beta1
kind: KafkaTopic
metadata:
  name: ccloud-stock-trades
  namespace: usm
spec:
  name: stock-trades
  partitionCount: 6
  replicas: 3
  kafkaRestClassRef:
    name: krc-cloud
