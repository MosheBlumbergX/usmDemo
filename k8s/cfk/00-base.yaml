# Namespace, storage class and the Connect service account (bound to an IAM role
# via EKS Pod Identity in terraform/s3.tf).
apiVersion: v1
kind: Namespace
metadata:
  name: usm
---
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: gp3
  annotations:
    storageclass.kubernetes.io/is-default-class: "true"
provisioner: ebs.csi.aws.com
volumeBindingMode: WaitForFirstConsumer
allowVolumeExpansion: true
reclaimPolicy: Delete
parameters:
  type: gp3
  fsType: ext4
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: connect
  namespace: usm
