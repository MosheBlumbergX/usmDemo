# JSON users from the datagen-users connector.
apiVersion: platform.confluent.io/v1beta1
kind: KafkaTopic
metadata:
  name: users
  namespace: usm
spec:
  kafkaClusterRef: { name: kafka }
  partitionCount: 3
  replicas: 3
---
# Avro pageviews from the datagen-pageviews connector (schema in CP SR).
apiVersion: platform.confluent.io/v1beta1
kind: KafkaTopic
metadata:
  name: pageviews
  namespace: usm
spec:
  kafkaClusterRef: { name: kafka }
  partitionCount: 3
  replicas: 3
---
apiVersion: platform.confluent.io/v1beta1
kind: KafkaTopic
metadata:
  name: streams-plaintext-input
  namespace: usm
spec:
  kafkaClusterRef: { name: kafka }
  partitionCount: 4
  replicas: 3
---
apiVersion: platform.confluent.io/v1beta1
kind: KafkaTopic
metadata:
  name: streams-wordcount-output
  namespace: usm
spec:
  kafkaClusterRef: { name: kafka }
  partitionCount: 4
  replicas: 3
---
# Output of the optional Flink "drop-gender" job (users without `gender`).
apiVersion: platform.confluent.io/v1beta1
kind: KafkaTopic
metadata:
  name: users-redacted
  namespace: usm
spec:
  kafkaClusterRef: { name: kafka }
  partitionCount: 3
  replicas: 3
